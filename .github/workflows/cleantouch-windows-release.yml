name: CleanTouch Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check version
        shell: pwsh
        run: |
          $version = (Get-Content cleantouch-project/cleantouch-desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and app version must match' }
      - run: npm ci
        working-directory: cleantouch-project/cleantouch-search-api
      - run: npm ci
        working-directory: cleantouch-project/cleantouch-desktop
      - run: npm run test:updates
        working-directory: cleantouch-project/cleantouch-desktop
      - run: npm run dist:win
        working-directory: cleantouch-project/cleantouch-desktop
      - run: node scripts/prepare-update-release.cjs
        working-directory: cleantouch-project/cleantouch-desktop
      - name: Prepare release for verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem cleantouch-project/cleantouch-desktop/dist/update-release -File | ForEach-Object { $_.FullName }
          if (!(Test-Path cleantouch-project/cleantouch-desktop/dist/update-release/latest.yml)) { throw 'Missing update metadata' }
          gh release create $env:GITHUB_REF_NAME @assets --draft --verify-tag --title "CleanTouch $env:GITHUB_REF_NAME" --notes 'Windows installation and update files. Publish after validating the installer.'
