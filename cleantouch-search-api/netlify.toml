[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/v1/place-chat/*"
  to = "/.netlify/functions/place-chat/:splat"
  status = 200

